# .github/workflows/ci.yml
#
# Runs on the self-hosted ryzn-server runners (cyberfighter.features.
# github-runner); nix and substituters come from the host itself. All jobs
# share the host's /nix/store, so build jobs hand their toplevel paths to
# one final job that pushes the deduplicated union closure once per cache.
name: CI (Build, Test, Cache, Deploy)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly reconcile: the pushed-paths record is ignored for this run, so
    # everything is re-offered and anything GC'd or evicted comes back.
    - cron: "0 10 * * 0"

permissions:
  contents: read

# A newer push supersedes the whole run; builds land in the shared store
# either way, so nothing of value is lost by cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The runner user cannot read the wheel-only system access-tokens file
# (nix skips the unreadable !include), so eval fetches authenticate with
# the job-scoped token instead of the personal PAT.
env:
  NIX_CONFIG: |
    access-tokens = github.com=${{ github.token }}

jobs:
  # Evaluation only, and deliberately not `nix flake check`. Evaluating a
  # flake output can need a store path realised -- hermes-agent is uv2nix,
  # import-from-derivation throughout -- and `--no-build` refuses to realise
  # it, so a check run ahead of the matrix fails with `path '...' is not
  # valid` on a cold store. The check moved below the matrix; this eval stays
  # here because the matrix cannot be built without it. It is not a syntax
  # gate: `builtins.attrNames` forces the attrset spine, not each
  # configuration, so a broken host module passes here and fails a second
  # later in its own matrix job -- nix evaluates before it builds, so that
  # costs a second, not a build.
  list-hosts:
    runs-on: [self-hosted, nixos]
    outputs:
      hosts: ${{ steps.list-hosts.outputs.hosts }}
      homes: ${{ steps.list-hosts.outputs.homes }}
    steps:
      - uses: actions/checkout@v7
      - name: List hosts
        id: list-hosts
        # The build matrix comes straight from the flake, so a host added to
        # hosts/default.nix is built by CI with no workflow edit.
        run: |
          echo "hosts=$(nix eval .#nixosConfigurations --apply builtins.attrNames --json)" >> "$GITHUB_OUTPUT"
          echo "homes=$(nix eval .#homeConfigurations --apply builtins.attrNames --json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Hosts in this run"
            echo ""
            echo "| Host | Profile | Traits | Home | Deploy |"
            echo "|---|---|---|---|---|"
            nix eval --file hosts/default.nix --raw --apply 'hosts:
              builtins.concatStringsSep "\n" (map (n:
                let
                  h = hosts.${n};
                  dash = v: if v == null then "&mdash;" else v;
                  traits = h.traits or [ ];
                in
                "| `${n}` | ${h.profile} | ${
                  if traits == [ ] then "&mdash;" else builtins.concatStringsSep ", " traits
                } | ${dash h.home} | ${dash h.deploy} |"
              ) (builtins.attrNames hosts))'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: list-hosts
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, nixos]
    strategy:
      matrix:
        host: ${{ fromJSON(needs.list-hosts.outputs.hosts) }}
      fail-fast: false # Continue other builds if one fails
    steps:
      - uses: actions/checkout@v7
      - name: Unlock git-crypt
        # Hosts build with their secret files decrypted; so must CI, or its
        # toplevels never match theirs. Before anything evaluates the flake.
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: .github/scripts/git-crypt-unlock.sh
      - name: Build system
        run: nix build --fallback .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
      - name: Record store path
        run: |
          mkdir -p path
          p=$(readlink -f result)
          echo "$p" > "path/${{ matrix.host }}"
          read -r _ closure <<<"$(nix path-info -S "$p" | tail -1)"
          {
            echo "| Host | Closure | Paths | Toplevel |"
            echo "|---|---|---|---|"
            echo "| \`${{ matrix.host }}\` | $(numfmt --to=iec "$closure")B | $(nix path-info -r "$p" | wc -l) | \`${p##*/}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: path-${{ matrix.host }}
          path: path/${{ matrix.host }}
          retention-days: 1

  # The standalone `home-manager switch` targets. Nothing else in CI touches
  # these: the host matrix builds nixosConfigurations, and the flake check
  # only evaluates them. Building them here parallelises the one part of the
  # check that was not already redundant, and puts the closures in the cache
  # so `hs` on the other machines pulls instead of building.
  home:
    needs: list-hosts
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, nixos]
    strategy:
      matrix:
        home: ${{ fromJSON(needs.list-hosts.outputs.homes) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Unlock git-crypt
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: .github/scripts/git-crypt-unlock.sh
      - name: Build home configuration
        env:
          HOME_CFG: ${{ matrix.home }}
        run: |
          mkdir -p path
          # The attribute name carries a `@`, so the attrpath needs quoting
          # inside the flake reference.
          p=$(nix build --fallback --no-link --print-out-paths \
                ".#homeConfigurations.\"$HOME_CFG\".activationPackage")
          echo "$p" > "path/home-$HOME_CFG"
          read -r _ closure <<<"$(nix path-info -S "$p" | tail -1)"
          {
            echo "| Home | Closure | Paths | Activation |"
            echo "|---|---|---|---|"
            echo "| \`$HOME_CFG\` | $(numfmt --to=iec "$closure")B | $(nix path-info -r "$p" | wc -l) | \`${p##*/}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: path-home-${{ matrix.home }}
          path: path/home-${{ matrix.home }}
          retention-days: 1

  # Below the matrix, for the reason on list-hosts: by now the store holds
  # every toplevel, so whatever evaluation needs realised is already there.
  # --show-trace because this is the command that truncates its own trace and
  # says so; the matrix builds above already name their own file and line.
  flake-check:
    needs: [list-hosts, build, home]
    if: ${{ needs.build.result == 'success' && needs.home.result == 'success' }}
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v7
      - name: Flake check
        # --no-build has to stay: `checks` is deploy-rs's schema and
        # activation checks, and the activation check depends on each node's
        # profile path. Realising them here would rebuild what the matrix
        # just did. They are built in their own job below instead.
        run: nix flake check --no-build --show-trace

  deploy-checks:
    needs: [list-hosts, build]
    # After the matrix, not as part of the gate: by now every toplevel these
    # depend on is in the shared store, so this is the cheap part on its own.
    # Only worth running when every host built -- a missing toplevel fails
    # the activation check for a reason that has nothing to do with deploy.
    if: ${{ needs.build.result == 'success' }}
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v7
      # deploy-activate depends on every toplevel; locked, it would build
      # the ciphertext variants next to the ones the matrix just built.
      - name: Unlock git-crypt
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: .github/scripts/git-crypt-unlock.sh
      - name: Build the deploy-rs checks
        # Validates deploy.nodes against deploy-rs's schema and assembles
        # each node's activation script. `nix flake check` only evaluates
        # these, so a violation that surfaces at build time slips past it.
        run: |
          nix build --no-link --print-out-paths \
            .#checks.x86_64-linux.deploy-schema \
            .#checks.x86_64-linux.deploy-activate

  push:
    needs: [list-hosts, build, home]
    # Push whatever did build, even if some hosts failed. A skipped `needs`
    # still satisfies `!cancelled()`, so the result has to be asserted
    # explicitly rather than left implicit.
    #
    # list-hosts, not flake-check: gating on the relocated check would skip
    # the push whenever one host failed to build, which is the case this job
    # exists to serve. Nothing is lost by not gating on evaluation either --
    # a tree that does not evaluate uploads no `path-*` artifacts, and
    # push-cache.yml exits 0 on an empty root set rather than falling back to
    # anything.
    if: ${{ !cancelled() && needs.list-hosts.result == 'success' }}
    uses: ./.github/workflows/push-cache.yml
    with:
      all-hosts: ${{ needs.list-hosts.outputs.hosts }}
      # Weekly reconcile: re-offer everything so anything GC'd comes back.
      reset-record: ${{ github.event_name == 'schedule' }}
    secrets: inherit

  # record maintains the deployable ref (the `latest` tag plus the release
  # of the same name) and the release history (one immutable release per
  # commit, so the Releases page grows instead of being overwritten). The
  # moving tag is what the deploy agent watches (hosts/ryzn-server,
  # features.deptui-agent), so it must only ever point at a tree that built,
  # checked and reached the caches -- a host switching to an uncached closure
  # would rebuild it locally. A plain `needs` skips this job whenever any of
  # the three failed or was skipped; no explicit result check needed. Push
  # events only: the weekly reconcile builds the same commit, and pull
  # requests are not main.
  record:
    needs: [flake-check, deploy-checks, push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, nixos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Preflight
        run: .github/scripts/preflight.sh gh git
      - name: Move the latest tag
        # Force-move the ref rather than delete-and-recreate: the agent
        # resolves it with `git ls-remote`, and a poll landing between the
        # two would find no tag and skip. A tag push matches no `branches`
        # filter, so this does not re-trigger the workflow.
        run: git push --force origin "$GITHUB_SHA:refs/tags/latest"
      - name: Write the release notes
        run: |
          {
            echo "Built, checked and cached by [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo ""
            echo "\`${GITHUB_SHA::7}\` $(git log -1 --format=%s "$GITHUB_SHA")"
          } > notes.md
      - name: Record a release for this commit
        # One immutable release per push: created fresh, never edited (an
        # edited record would rewrite history the page exists to hold). The
        # tag is the commit's short SHA -- unique for this repo's push pace,
        # and human-unique across forks, unlike a run- or date-derived name.
        # --latest gives the newest record GitHub's Latest badge. There is no
        # separate `latest` release: editing one in place keeps its first
        # publish date forever. The `latest` tag above is a different thing
        # and stays -- it is what the deploy agent watches.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=${GITHUB_SHA:0:12}
          # A duplicate push of the same commit (a force-push re-tip) would
          # otherwise fail on the existing release; record it once and stop.
          if gh release view "$short" >/dev/null 2>&1; then
            echo "Release ${short} already exists; nothing new to record."
            exit 0
          fi
          # --target creates the tag server-side. A local `git tag -a` would
          # need a committer identity the runner does not have.
          gh release create "$short" --target "$GITHUB_SHA" \
            --title "$short" --notes-file notes.md --latest

  # A kick is "check now", nothing more: the watches name the tag. The
  # runners are the agent's host, so this goes over the control socket --
  # no token, no listener; the CLI and the socket group come from
  # github-runner.extraPackages/extraGroups on ryzn-server. A kick that
  # lands while a run is in flight is queued, so fleet then self is safe in
  # sequence and the self-deploy (which restarts the agent) waits for the
  # fleet run.
  deploy:
    needs: record
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v7
      - name: Preflight
        run: .github/scripts/preflight.sh deptui-agent jq
      - name: Kick deptui-agent
        run: |
          deptui-agent kick --watch fleet
          deptui-agent kick --watch self
      - name: Report what the fleet took
        # Same control socket as the kick, so no ssh to the fleet and no
        # secret. A host that did not take the commit is a warning: the tree
        # built, checked and cached fine, and a held or offline host is an
        # operational matter that a later kick clears on its own.
        run: .github/scripts/verify-deploy.sh
