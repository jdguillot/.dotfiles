# .github/workflows/weekly-update.yml
#
# The weekly bump, end to end: stage the user's `staging/*` work, triage the
# upstream changes against it, apply the bump minus the holds, prove it
# builds, warm the caches, then open the pull request.
#
# Runs on the self-hosted ryzn-server runners, not ubuntu-latest, for three
# reasons: the builds land in the store the other machines pull from, the
# closure is pushed to the caches from the host that just built it, and the
# triage model is on this host's loopback.
#
# The shape:
#   scan     pull in from `staging/*` any branch that will merge cleanly
#            (leave the rest for their own pull request), gather upstream
#            evidence, ask the local model what to hold back and what the
#            week of upstream changes means for this host
#   update   reproduce that tree in this job (same starting tree, same
#            branches, so the merges agree), apply the bump minus the holds,
#            flake check, build every host, let an agent try to adapt the
#            repo on failure, push the branch
#   cache    push what built, so the closure is hot before anyone switches
#   pr       open the pull request -- only reached when the tree is green
#            AND it is actually different from `main` (something bumped, or
#            staged work landed; a no-change week opens nothing)
#
# A no-change week is a real outcome, not an error: if nothing staged and
# nothing to bump, the run finishes green with an empty PR and no one has
# to read it.
name: Weekly update

on:
  schedule:
    # Tuesday 05:00 UTC -- lands before the week starts, and after most
    # upstreams have cut their weekend releases. Giving an extra day for fixes.
    - cron: "0 5 * * 2"
  workflow_dispatch:
    inputs:
      skip-scan:
        description: Bump everything, without the upstream-issue triage pass.
        type: boolean
        default: false
      fix-timeout-minutes:
        description: Wall-clock budget for the fix agent before it is stopped.
        type: number
        default: 30

permissions:
  contents: write
  pull-requests: write

# One bump at a time. A second run would race the first on the branch and on
# the GPU the triage model sits on.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    access-tokens = github.com=${{ github.token }}
  UPDATE_BRANCH: automated/weekly-update

jobs:
  scan:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v7
        with:
          # `git merge` needs ancestry. A depth-1 clone would make the
          # `staging/*` attempts fail with `shallow` errors.
          fetch-depth: 0

      - name: Preflight
        run: .github/scripts/preflight.sh gh jq curl git

      # Pull in the staging work first, before asking the LLM to reason
      # about anything. The LLM is looking at two documents: the upstream
      # digest and the staged commit subjects; it needs both.
      - name: Merge `staging/*` branches
        run: |
          .github/scripts/merge-staging.sh
          echo "### Staged branches" >> "$GITHUB_STEP_SUMMARY"
          cat staging-report/staging.md >> "$GITHUB_STEP_SUMMARY"

      - name: Collect upstream signal
        if: ${{ !inputs.skip-scan }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/collect-upstream-signal.sh

      - name: Ask the model what to hold back
        run: |
          mkdir -p upstream-signal
          if [ "${{ inputs.skip-scan }}" = "true" ]; then
            echo '{"holds":[],"summary":"Triage skipped by manual dispatch.",
                   "staged_notes":"Triage skipped by manual dispatch.",
                   "degraded":true}' \
              > upstream-signal/verdict.json
          else
            STAGED_REPORT=staging-report .github/scripts/scan-verdict.sh
          fi

      - name: Ask the model for release notes
        # Independent so a model failure degrades one side and not the other;
        # the gate below is the same either way.
        if: ${{ !inputs.skip-scan }}
        run: .github/scripts/scan-release-notes.sh

      - name: Summarise
        run: |
          {
            echo "## Pre-update triage"
            echo ""
            jq -r .summary upstream-signal/verdict.json
            echo ""
            staged_notes=$(jq -r '.staged_notes // ""' upstream-signal/verdict.json)
            if [ -n "$staged_notes" ]; then
              echo "### The staged work"
              echo ""
              echo "$staged_notes"
              echo ""
            fi
            if [ "$(jq '.holds | length' upstream-signal/verdict.json)" -gt 0 ]; then
              echo "| Held back | Reason | Evidence |"
              echo "|---|---|---|"
              jq -r '.holds[] | "| `\(.name)` | \(.reason) | \(.evidence) |"' \
                upstream-signal/verdict.json
            else
              echo "Nothing held back."
            fi
            if [ -s upstream-signal/release-notes.md ]; then
              echo ""
              echo "## Release notes preview"
              echo ""
              cat upstream-signal/release-notes.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: upstream-signal
          path: upstream-signal/
          retention-days: 14

  update:
    needs: scan
    runs-on: [self-hosted, nixos]
    outputs:
      # 'true' only when the flake checked and every host built -- after the
      # agent's fix, if it took one. Empty on a no-change week; the `if`
      # gates below all treat empty as 'skip', which is what we want.
      green: ${{ steps.verify.outputs.green == 'true' || steps.reverify.outputs.green == 'true' }}
      hosts: ${{ steps.verify.outputs.hosts || steps.reverify.outputs.hosts }}
      changed: ${{ steps.changed.outputs.changed }}
      agent-fixed: ${{ steps.fix.outputs.attempted }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The branch is force-pushed from here, so the job needs push
          # credentials on the checkout it already has.
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: upstream-signal
          path: upstream-signal

      - name: Preflight
        # opencode included: it is only reached on the failure path, but
        # finding out it is absent there means finding out after a build has
        # already failed, with the fix step silently skipped.
        run: .github/scripts/preflight.sh jq nix npins git opencode -- mcp-nixos

      - name: Keep the run's scratch files out of the commit
        # The commit below has to stage whatever the fix agent touched, so it
        # cannot enumerate paths and uses `git add -A`. These exclusions are
        # local to this checkout and are themselves never committed.
        run: |
          cat >> .git/info/exclude <<'EOF'
          /staging-report/
          /upstream-signal/
          /path/
          /build-hosts.json
          /build-homes.json
          /boot-pre.json
          /boot-post.json
          /reboot-notes.md
          /build-failure.log
          /fix-notes.md
          EOF

      # Re-run the merge here, not on the `scan` job's tree: the scan's
      # working tree died with the job. Same starting commit, same branches,
      # same sort order -> same merge result, so what we build is what the
      # triage judged. The `staging-report` that this produces is what the
      # `pr` job prints, and it is byte-identical to the one the scan job
      # saw.
      - name: Merge `staging/*` branches (reproduce the scan's tree)
        run: .github/scripts/merge-staging.sh

      - name: Record boot inputs before the bump
        # Pure evaluation of kernel/initrd/modules per host, so the step
        # after the bump can say which hosts a plain `switch` cannot fully
        # apply. Has to run before apply-updates.sh moves the lock.
        run: .github/scripts/boot-requirement.sh record boot-pre.json

      - name: Apply the bump
        id: apply
        run: |
          .github/scripts/apply-updates.sh

      # 'changed' means: the tree this job will push is different from
      # main. That includes the staged merges (committed) and the flake bump
      # (still uncommitted at this point). This is the gate for opening a
      # pull request at all.
      #
      # Diff against `origin/main` WITHOUT a second commit on purpose: that
      # compares the working tree (with the uncommitted lock/npins changes)
      # to main. A `HEAD` comparison would miss a bump that is only in the
      # working tree and report a no-change week as one.
      - name: Determine whether the tree changed
        id: changed
        run: |
          if git diff --quiet origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed: no staged branches merged, and every input was already up to date or held back." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check and build every host
        id: verify
        if: steps.changed.outputs.changed == 'true'
        continue-on-error: true
        run: |
          .github/scripts/check-and-build.sh
          # Reached only when nothing above failed.
          echo "hosts=$(cat build-hosts.json)" >> "$GITHUB_OUTPUT"
          echo "green=true" >> "$GITHUB_OUTPUT"

      - name: Let the agent try to adapt the repo
        id: fix
        if: steps.changed.outputs.changed == 'true' && steps.verify.outcome == 'failure'
        continue-on-error: true
        env:
          # opencode keeps its session database and its provider packages
          # under HOME; the ephemeral runner's own is not a good home for
          # them, and this one is thrown away with the job.
          HOME: ${{ runner.temp }}/agent-home
          OPENCODE_CONFIG: ${{ github.workspace }}/.github/opencode/opencode.json
          # Empty on a scheduled run, where `inputs` carries nothing.
          BUDGET_MINUTES: ${{ inputs.fix-timeout-minutes || 30 }}
        run: |
          mkdir -p "$HOME/.config/opencode"
          # opencode reads skills from $XDG_CONFIG_HOME/opencode/skills, and
          # HOME here is a scratch dir with no home configuration behind it.
          ln -sfn "$(nix build --no-link --print-out-paths .#ci-agent-skills)" \
            "$HOME/.config/opencode/skills"
          # The MCP server is a help, not a dependency: ryzn-server may not
          # have been rebuilt since mcp-nixos was added to its runner PATH.
          # Drop the declaration rather than hand opencode a command that is
          # not there.
          if ! command -v mcp-nixos >/dev/null 2>&1; then
            jq 'del(.mcp)' "$OPENCODE_CONFIG" > "$HOME/opencode.json"
            export OPENCODE_CONFIG="$HOME/opencode.json"
            echo "::warning::mcp-nixos absent; running the agent without the nixos MCP"
          fi
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          # The agent reads this; the head of a Nix trace is the useful part,
          # but the error itself is at the tail, so keep both ends.
          if [ "$(wc -c < build-failure.log)" -gt 120000 ]; then
            { head -c 40000 build-failure.log
              printf '\n\n[... trimmed ...]\n\n'
              tail -c 80000 build-failure.log; } > trimmed.log
            mv trimmed.log build-failure.log
          fi
          # --auto: nobody is here to approve each edit. The blast radius is
          # one ephemeral checkout, discarded unless it goes green, and the
          # prompt forbids touching the lock files.
          #
          # Bounded, because the failure mode is not a wrong edit but no edit:
          # the agent chases a wrong hypothesis and the run holds the
          # concurrency group and the GPU for as long as it likes. The budget
          # goes into the prompt too, so it can wind down and write its notes
          # instead of only being killed. SIGTERM first, SIGKILL if it does
          # not take the hint.
          set +e
          timeout --signal=TERM --kill-after=60s "${BUDGET_MINUTES}m" \
            opencode run --pure --auto --agent build \
            "$(sed "s/@BUDGET_MINUTES@/$BUDGET_MINUTES/g" .github/opencode/fix-prompt.md)"
          rc=$?
          set -e

          if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then
            echo "::warning::fix agent hit its ${BUDGET_MINUTES}m budget and was stopped"
            {
              echo
              echo "## Stopped at the ${BUDGET_MINUTES} minute budget"
              echo
              echo "The agent did not reach a green tree in the time it was given."
              echo "Anything above this line is its own account, written before it"
              echo "was stopped; anything it was still verifying is unverified."
            } >> fix-notes.md
          fi

      - name: Re-check after the fix
        id: reverify
        if: steps.fix.outputs.attempted == 'true'
        continue-on-error: true
        run: |
          {
            echo "### What the agent changed"
            echo '```'
            git --no-pager diff --stat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/check-and-build.sh
          echo "hosts=$(cat build-hosts.json)" >> "$GITHUB_OUTPUT"
          echo "green=true" >> "$GITHUB_OUTPUT"

      - name: Work out how the bump has to be applied
        id: reboot
        if: steps.verify.outputs.green == 'true' || steps.reverify.outputs.green == 'true'
        run: |
          .github/scripts/boot-requirement.sh record boot-post.json
          .github/scripts/boot-requirement.sh compare boot-pre.json boot-post.json > reboot-notes.md
          cat reboot-notes.md >> "$GITHUB_STEP_SUMMARY"

      # Push the branch from here, not from the pr job: the agent's fix lives
      # in this working tree, and only this job has it. A branch push is not
      # a pull request, and it only happens when the tree is green AND it is
      # actually different from main (a no-change week keeps main untouched).
      - name: Push the branch
        if: >-
          steps.changed.outputs.changed == 'true' &&
          (steps.verify.outputs.green == 'true' || steps.reverify.outputs.green == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add -A
          git commit -m "chore: weekly update"
          git push --force origin "$UPDATE_BRANCH"

      # Named path-* so push-cache.yml's download pattern picks it up; the
      # directory is stripped on upload, so each host lands as paths/<host>.
      # Only on a no-change week the closure is not new, so skip the push;
      # the caches already have the previous closure and that is still valid.
      - uses: actions/upload-artifact@v7
        if: >-
          steps.changed.outputs.changed == 'true' &&
          (steps.verify.outputs.green == 'true' || steps.reverify.outputs.green == 'true')
        with:
          name: path-bundle
          path: path/
          retention-days: 1

      # The `pr` job and the next run both need to know what was in this tree.
      # Uploaded unconditionally on a changed week (or always, so a no-change
      # week's log still has the report), so the PR body prints it.
      - uses: actions/upload-artifact@v7
        if: always() && steps.changed.outputs.changed == 'true'
        with:
          name: update-report
          path: |
            staging-report/staging.md
            staging-report/staged-commits.txt
            build-failure.log
            fix-notes.md
            reboot-notes.md
          if-no-files-found: ignore
          retention-days: 14

  cache:
    needs: update
    if: needs.update.outputs.green == 'true' && needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/push-cache.yml
    with:
      all-hosts: ${{ needs.update.outputs.hosts }}
    secrets: inherit

  pr:
    needs: [update, cache]
    # A cache hiccup should not cost the week its pull request, so this waits
    # for the push but does not require it to have succeeded. A no-change
    # week is a legitimate "no pull request" outcome.
    if: ${{ !cancelled() && needs.update.outputs.green == 'true' && needs.update.outputs.changed == 'true' }}
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: upstream-signal
          path: upstream-signal
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: update-report
          path: update-report

      - name: Open or update the pull request
        env:
          # A PR opened with the default GITHUB_TOKEN does NOT trigger other
          # workflows -- GitHub suppresses that to avoid recursive runs -- so
          # cachix.yml would never post a status on it. The builds in the
          # update job already proved the tree; this is so the PR shows it.
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          HOSTS: ${{ needs.update.outputs.hosts }}
          CACHED: ${{ needs.cache.result }}
        run: |
          n=$(tr -d '[]" ' <<<"$HOSTS" | tr ',' '\n' | grep -c .)
          body=pr-body.md
          {
            echo "Weekly update: the week's upstream bump plus any \`staging/*\` work that merged cleanly."
            echo ""
            echo "\`nix flake check\` passed and all $n hosts built on \`ryzn-server\`."
            if [ "$CACHED" = "success" ]; then
              echo "The closure is already in \`attic:main\` and \`cachix:jdguillot\`, so switching pulls rather than builds."
            else
              echo "> The cache push did not succeed ($CACHED) &mdash; switching will build locally."
            fi
            echo ""

            if [ -s update-report/staging.md ]; then
              echo "## Staged branches"
              echo ""
              cat update-report/staging.md
              echo ""
              if [ -s update-report/staged-commits.txt ]; then
                echo "### Commits landed"
                echo ""
                echo '```'
                cat update-report/staged-commits.txt
                echo '```'
                echo ""
              fi
            fi

            echo "## Pre-update triage"
            echo ""
            jq -r .summary upstream-signal/verdict.json
            echo ""
            staged_notes=$(jq -r '.staged_notes // ""' upstream-signal/verdict.json)
            if [ -n "$staged_notes" ] && [ "$staged_notes" != "N/A: no staged work merged." ]; then
              echo "### The staged work"
              echo ""
              echo "$staged_notes"
              echo ""
            fi
            if [ "$(jq '.holds | length' upstream-signal/verdict.json)" -gt 0 ]; then
              echo "### Held at their current revision"
              echo ""
              echo "| Input | Reason | Evidence |"
              echo "|---|---|---|"
              jq -r '.holds[] | "| `\(.name)` | \(.reason) | \(.evidence) |"' upstream-signal/verdict.json
              echo ""
            fi

            if [ -s upstream-signal/release-notes.md ]; then
              echo "## What landed upstream"
              echo ""
              cat upstream-signal/release-notes.md
              echo ""
            fi

            if [ -s update-report/reboot-notes.md ]; then
              echo "## Applying this bump"
              echo ""
              cat update-report/reboot-notes.md
              echo ""
            fi

            if [ -s update-report/fix-notes.md ]; then
              echo "## The bump needed a code change"
              echo ""
              cat update-report/fix-notes.md
              echo ""
              echo "> Written by the agent that made the change. Read the diff outside the lock files carefully."
              echo ""
            fi

            echo "<sub>Opened by \`.github/workflows/weekly-update.yml\`, run [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).</sub>"
          } > "$body"

          gh pr create --repo "$GITHUB_REPOSITORY" \
            --head "$UPDATE_BRANCH" --base main \
            --title "chore: weekly update" \
            --body-file "$body" \
            --label dependencies --label automated \
          || gh pr edit "$UPDATE_BRANCH" --repo "$GITHUB_REPOSITORY" --body-file "$body"
