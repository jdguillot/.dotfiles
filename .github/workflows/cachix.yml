# .github/workflows/cachix.yml
#
# Runs on the self-hosted ryzn-server runners (cyberfighter.features.
# github-runner); nix and substituters come from the host itself. All jobs
# share the host's /nix/store, so build jobs hand their toplevel paths to
# one final job that pushes the deduplicated union closure once per cache.
name: Build and Cache
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly reconcile: the pushed-paths record is ignored for this run, so
    # everything is re-offered and anything GC'd or evicted comes back.
    - cron: "0 10 * * 0"

permissions:
  contents: read

# A newer push supersedes the whole run; builds land in the shared store
# either way, so nothing of value is lost by cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The runner user cannot read the wheel-only system access-tokens file
# (nix skips the unreadable !include), so eval fetches authenticate with
# the job-scoped token instead of the personal PAT.
env:
  NIX_CONFIG: |
    access-tokens = github.com=${{ github.token }}

jobs:
  flake-check:
    runs-on: [self-hosted, nixos]
    outputs:
      hosts: ${{ steps.list-hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@v7
      - name: Flake check
        # --no-build, and it has to stay: `checks` is deploy-rs's schema and
        # activation checks, and the activation check depends on each node's
        # profile path. Realising it therefore realises the host toplevels,
        # which drags the entire build into this one serial job ahead of the
        # matrix -- measured at 54s to 7m22s. The checks are built in their
        # own job below instead, once the matrix has the toplevels.
        run: nix flake check --no-build
      - name: List hosts
        id: list-hosts
        # The build matrix comes straight from the flake, so a host added to
        # hosts/default.nix is built by CI with no workflow edit.
        run: |
          echo "hosts=$(nix eval .#nixosConfigurations --apply builtins.attrNames --json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Hosts in this run"
            echo ""
            echo "| Host | Profile | Traits | Home | Deploy |"
            echo "|---|---|---|---|---|"
            nix eval --file hosts/default.nix --raw --apply 'hosts:
              builtins.concatStringsSep "\n" (map (n:
                let
                  h = hosts.${n};
                  dash = v: if v == null then "&mdash;" else v;
                  traits = h.traits or [ ];
                in
                "| `${n}` | ${h.profile} | ${
                  if traits == [ ] then "&mdash;" else builtins.concatStringsSep ", " traits
                } | ${dash h.home} | ${dash h.deploy} |"
              ) (builtins.attrNames hosts))'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: flake-check
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, nixos]
    strategy:
      matrix:
        host: ${{ fromJSON(needs.flake-check.outputs.hosts) }}
      fail-fast: false # Continue other builds if one fails
    steps:
      - uses: actions/checkout@v7
      - name: Build system
        run: nix build --fallback .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
      - name: Record store path
        run: |
          mkdir -p path
          p=$(readlink -f result)
          echo "$p" > "path/${{ matrix.host }}"
          read -r _ closure <<<"$(nix path-info -S "$p" | tail -1)"
          {
            echo "| Host | Closure | Paths | Toplevel |"
            echo "|---|---|---|---|"
            echo "| \`${{ matrix.host }}\` | $(numfmt --to=iec "$closure")B | $(nix path-info -r "$p" | wc -l) | \`${p##*/}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: path-${{ matrix.host }}
          path: path/${{ matrix.host }}
          retention-days: 1

  deploy-checks:
    needs: [flake-check, build]
    # After the matrix, not as part of the gate: by now every toplevel these
    # depend on is in the shared store, so this is the cheap part on its own.
    # Only worth running when every host built -- a missing toplevel fails
    # the activation check for a reason that has nothing to do with deploy.
    if: ${{ needs.build.result == 'success' }}
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v7
      - name: Build the deploy-rs checks
        # Validates deploy.nodes against deploy-rs's schema and assembles
        # each node's activation script. `nix flake check` only evaluates
        # these, so a violation that surfaces at build time slips past it.
        run: |
          nix build --no-link --print-out-paths \
            .#checks.x86_64-linux.deploy-schema \
            .#checks.x86_64-linux.deploy-activate

  push:
    needs: [flake-check, build]
    # Push whatever did build, even if some hosts failed -- but never on a
    # failed flake check. A skipped `needs` still satisfies `!cancelled()`,
    # so the flake-check result has to be asserted explicitly or an eval
    # error would silently fall through to a push of the previous closure.
    if: ${{ !cancelled() && needs.flake-check.result == 'success' }}
    uses: ./.github/workflows/push-cache.yml
    with:
      all-hosts: ${{ needs.flake-check.outputs.hosts }}
      # Weekly reconcile: re-offer everything so anything GC'd comes back.
      reset-record: ${{ github.event_name == 'schedule' }}
    secrets: inherit
