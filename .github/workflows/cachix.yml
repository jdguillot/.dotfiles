# .github/workflows/cachix.yml
#
# Runs on the self-hosted ryzn-server runners (cyberfighter.features.
# github-runner); nix and substituters come from the host itself. All jobs
# share the host's /nix/store, so build jobs hand their toplevel paths to
# one final job that pushes the deduplicated union closure once per cache.
name: Build and Cache
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly reconcile: the pushed-paths record is ignored for this run, so
    # everything is re-offered and anything GC'd or evicted comes back.
    - cron: "0 10 * * 0"

permissions:
  contents: read

# A newer push supersedes the whole run; builds land in the shared store
# either way, so nothing of value is lost by cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The runner user cannot read the wheel-only system access-tokens file
# (nix skips the unreadable !include), so eval fetches authenticate with
# the job-scoped token instead of the personal PAT.
env:
  NIX_CONFIG: |
    access-tokens = github.com=${{ github.token }}

jobs:
  flake-check:
    runs-on: [self-hosted, nixos]
    outputs:
      hosts: ${{ steps.list-hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@v7
      - name: Flake check
        # --no-build: evaluate every check but build nothing; the per-host
        # matrix below does the real builds.
        run: nix flake check --no-build
      - name: List hosts
        id: list-hosts
        # The build matrix comes straight from the flake, so a host added to
        # hosts/default.nix is built by CI with no workflow edit.
        run: |
          echo "hosts=$(nix eval .#nixosConfigurations --apply builtins.attrNames --json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Hosts in this run"
            echo ""
            echo "| Host | Profile | Traits | Home | Deploy |"
            echo "|---|---|---|---|---|"
            nix eval --file hosts/default.nix --raw --apply 'hosts:
              builtins.concatStringsSep "\n" (map (n:
                let
                  h = hosts.${n};
                  dash = v: if v == null then "&mdash;" else v;
                  traits = h.traits or [ ];
                in
                "| `${n}` | ${h.profile} | ${
                  if traits == [ ] then "&mdash;" else builtins.concatStringsSep ", " traits
                } | ${dash h.home} | ${dash h.deploy} |"
              ) (builtins.attrNames hosts))'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: flake-check
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, nixos]
    strategy:
      matrix:
        host: ${{ fromJSON(needs.flake-check.outputs.hosts) }}
      fail-fast: false # Continue other builds if one fails
    steps:
      - uses: actions/checkout@v7
      - name: Build system
        run: nix build --fallback .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
      - name: Record store path
        run: |
          mkdir -p path
          p=$(readlink -f result)
          echo "$p" > "path/${{ matrix.host }}"
          read -r _ closure <<<"$(nix path-info -S "$p" | tail -1)"
          {
            echo "| Host | Closure | Paths | Toplevel |"
            echo "|---|---|---|---|"
            echo "| \`${{ matrix.host }}\` | $(numfmt --to=iec "$closure")B | $(nix path-info -r "$p" | wc -l) | \`${p##*/}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: path-${{ matrix.host }}
          path: path/${{ matrix.host }}
          retention-days: 1

  push:
    needs: build
    # Push whatever did build, even if some hosts failed.
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: path-*
          path: paths
          merge-multiple: true
      # Paths recorded here were fully pushed by an earlier run; the diff
      # below skips even the per-path existence queries for them. Cache keys
      # are immutable, so save under the run id and restore the newest.
      - uses: actions/cache@v6
        with:
          path: pushed-paths.txt
          key: pushed-paths-${{ github.run_id }}
          restore-keys: |
            pushed-paths-
      - name: Push new paths once
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          cat paths/* 2>/dev/null | sort -u > roots.txt || true
          if ! [ -s roots.txt ]; then
            echo "No successful builds to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          nix path-info -r $(< roots.txt) | sort -u > closure.txt
          touch pushed-paths.txt
          sort -u pushed-paths.txt > prev.txt
          # Scheduled runs re-offer everything; this also resets the record
          # to the live closure, shedding stale entries.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            : > prev.txt
          fi
          comm -13 prev.txt closure.txt > new.txt
          if [ -s new.txt ]; then
            attic login local https://attic.cyberfighter.space/ "$ATTIC_TOKEN"
            xargs attic push main < new.txt
            cachix push jdguillot < new.txt
          fi
          # Only reached after successful pushes; a failed run keeps the old
          # record so nothing is skipped by mistake next time.
          sort -u prev.txt closure.txt > pushed-paths.txt
      - name: Report
        run: |
          [ -s roots.txt ] || exit 0
          # True deduplicated size: sum of NAR sizes over the union closure.
          union=0
          while read -r _ s; do union=$((union + s)); done < <(xargs nix path-info -s < closure.txt)
          {
            echo "## Cache push"
            echo ""
            echo "| Host | Closure | Paths | Toplevel |"
            echo "|---|---|---|---|"
            for f in paths/*; do
              p=$(cat "$f")
              read -r _ s <<<"$(nix path-info -S "$p" | tail -1)"
              echo "| \`${f##*/}\` | $(numfmt --to=iec "$s")B | $(nix path-info -r "$p" | wc -l) | \`${p##*/}\` |"
            done
            echo "| **union (deduplicated)** | **$(numfmt --to=iec "$union")B** | **$(wc -l < closure.txt)** | pushed once |"
            echo ""
            echo "**New paths pushed this run:** $(wc -l < new.txt) of $(wc -l < closure.txt) &mdash; the rest were already recorded as pushed. Targets: \`attic:main\`, \`cachix:jdguillot\`."
          } >> "$GITHUB_STEP_SUMMARY"
