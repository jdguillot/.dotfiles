# .github/workflows/cachix.yml
name: Build and Cache
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@main
      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          extra-conf: |
            connect-timeout = 30
            fallback = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - uses: cachix/cachix-action@v17
        with:
          name: jdguillot
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Perform Flake check
        run: nix flake check

  build:
    needs: flake-check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Must match flake.nix `nixosConfigurations` exactly. A name that no
        # longer exists fails the whole job with a confusing eval error, and a
        # host missing from this list is simply never built by CI.
        host:
          [
            razer-nixos,
            work-nix-wsl,
            sys-galp-nix,
            thkpd-pve1,
            simple-vm,
            vm-gameserver-nix,
            ryzn-server,
          ]
      fail-fast: false # Continue other builds if one fails
    steps:
      - uses: actions/checkout@v7
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: DeterminateSystems/determinate-nix-action@main
        with:
          # The CUDA cache has to be declared HERE, not just in
          # modules/core/nix-settings. That module configures the nix daemon on
          # the built hosts; it has no effect on this runner's nix, which is
          # what actually performs the build. Without it, ryzn-server's
          # ollama-cuda is compiled from source on a GitHub runner.
          extra-conf: |
            connect-timeout = 30
            fallback = true
            extra-substituters = https://cache.nixos-cuda.org
            extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ matrix.host }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ matrix.host }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ matrix.host }}-
          purge-last-accessed: P1DT12H
          purge-primary-key: never
      - uses: cachix/cachix-action@v17
        with:
          name: jdguillot
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build Systems
        run: |
          nix build --fallback .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
      - name: Push to Cachix
        run: nix path-info -r ./result | cachix push jdguillot
