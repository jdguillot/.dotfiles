# .github/workflows/cachix.yml
#
# Runs on the self-hosted ryzn-server runner (cyberfighter.features.
# github-runner): jobs share the host's /nix/store and nix daemon, which
# removed most of this workflow -- no nix installer, no cache save/restore,
# no disk freeing, no per-runner extra-conf (substituters, the CUDA cache
# included, come from the host's own nix.conf via modules/core/nix-settings).
# The runner user cannot read the system access-tokens sops template (wheel-
# only; nix skips the unreadable !include), so eval fetches authenticate
# with the job-scoped token below instead of the personal PAT.
name: Build and Cache
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NIX_CONFIG: |
    access-tokens = github.com=${{ github.token }}

jobs:
  flake-check:
    runs-on: [self-hosted, nixos]
    outputs:
      hosts: ${{ steps.list-hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@v7
      - name: Flake check
        # --no-build: evaluate every check but build nothing; the per-host
        # matrix below does the real builds.
        run: nix flake check --no-build
      - name: List hosts
        id: list-hosts
        # The build matrix comes straight from the flake, so a host added to
        # hosts/default.nix is built by CI with no workflow edit.
        run: |
          echo "hosts=$(nix eval .#nixosConfigurations --apply builtins.attrNames --json)" >> "$GITHUB_OUTPUT"

  build:
    needs: flake-check
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, nixos]
    strategy:
      matrix:
        host: ${{ fromJSON(needs.flake-check.outputs.hosts) }}
      fail-fast: false # Continue other builds if one fails
    steps:
      - uses: actions/checkout@v7
      - name: Build system
        run: nix build --fallback .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
      - name: Push to Cachix
        # cachix is on the runner PATH (github-runner.extraPackages). Runtime
        # closures only; flake input sources stay warm in the persistent
        # store, so they no longer need pushing to survive rate limits.
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: nix path-info -r ./result | cachix push jdguillot
