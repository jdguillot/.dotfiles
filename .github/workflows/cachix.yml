# .github/workflows/cachix.yml
#
# Runs on the self-hosted ryzn-server runners (cyberfighter.features.
# github-runner); nix and substituters come from the host itself. All jobs
# share the host's /nix/store, so build jobs hand their toplevel paths to
# one final job that pushes the deduplicated union closure once per cache.
name: Build and Cache
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The runner user cannot read the wheel-only system access-tokens file
# (nix skips the unreadable !include), so eval fetches authenticate with
# the job-scoped token instead of the personal PAT.
env:
  NIX_CONFIG: |
    access-tokens = github.com=${{ github.token }}

jobs:
  flake-check:
    runs-on: [self-hosted, nixos]
    outputs:
      hosts: ${{ steps.list-hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@v7
      - name: Flake check
        # --no-build: evaluate every check but build nothing; the per-host
        # matrix below does the real builds.
        run: nix flake check --no-build
      - name: List hosts
        id: list-hosts
        # The build matrix comes straight from the flake, so a host added to
        # hosts/default.nix is built by CI with no workflow edit.
        run: |
          echo "hosts=$(nix eval .#nixosConfigurations --apply builtins.attrNames --json)" >> "$GITHUB_OUTPUT"
          {
            echo "### Hosts in this run"
            nix eval .#nixosConfigurations \
              --apply 'a: builtins.concatStringsSep "\n" (map (h: "- `" + h + "`") (builtins.attrNames a))' \
              --raw
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: flake-check
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, nixos]
    strategy:
      matrix:
        host: ${{ fromJSON(needs.flake-check.outputs.hosts) }}
      fail-fast: false # Continue other builds if one fails
    steps:
      - uses: actions/checkout@v7
      - name: Build system
        run: nix build --fallback .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
      - name: Record store path
        run: |
          mkdir -p path
          readlink -f result > "path/${{ matrix.host }}"
          read -r _ closure <<<"$(nix path-info -S "$(readlink -f result)" | tail -1)"
          echo "\`${{ matrix.host }}\`: $(numfmt --to=iec "$closure")B closure" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: path-${{ matrix.host }}
          path: path/${{ matrix.host }}
          retention-days: 1

  push:
    needs: build
    # Push whatever did build, even if some hosts failed.
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: path-*
          path: paths
          merge-multiple: true
      - name: Push union closure once
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          cat paths/* 2>/dev/null | sort -u > roots.txt || true
          if ! [ -s roots.txt ]; then
            echo "No successful builds to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          nix path-info -r $(< roots.txt) | sort -u > closure.txt
          attic login local https://attic.cyberfighter.space/ "$ATTIC_TOKEN"
          xargs attic push main < closure.txt
          cachix push jdguillot < closure.txt
      - name: Report
        run: |
          [ -s roots.txt ] || exit 0
          {
            echo "## Cache push"
            echo "| Host | Closure | Toplevel |"
            echo "|---|---|---|"
            for f in paths/*; do
              p=$(cat "$f")
              read -r _ s <<<"$(nix path-info -S "$p" | tail -1)"
              echo "| ${f##*/} | $(numfmt --to=iec "$s")B | \`${p##*/}\` |"
            done
            echo
            echo "**Unique store paths in the union closure:** $(wc -l < closure.txt)"
            echo
            echo "Pushed once to \`attic:main\` and \`cachix:jdguillot\` (both skip already-cached paths)."
          } >> "$GITHUB_STEP_SUMMARY"
