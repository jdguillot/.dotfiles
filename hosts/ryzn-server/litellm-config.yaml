# LiteLLM gateway config, deployed verbatim by ai.litellm.configFile.
# Reference: https://docs.litellm.ai/docs/proxy/configs
#
# model_list is the whole team catalog (keys are minted against these
# names). Keep it ONE big model + one small, names model-agnostic (team-*)
# so a swap never touches teammate configs.

model_list:
  # openai/ (Ollama's /v1 endpoint), NOT upstream-recommended ollama_chat/:
  # that translator ends streamed tool calls with finish_reason "stop"
  # (BerriAI/litellm#35663, fixes unmerged as of v1.99.1), which kills the
  # agent loop in clients that trust it (crush stops after every tool call).
  # The passthrough route streams Ollama's correct "tool_calls" reason.
  - model_name: team-coder
    litellm_params:
      model: openai/qwen3.8:27b-q4_K_M
      api_base: http://host.docker.internal:11434/v1
      # The openai/ route's SDK client refuses to start without a key;
      # Ollama ignores it, any non-empty value passes.
      api_key: ollama
      # Cloudflare kills proxied requests silent >125s; big-context prompt
      # eval exceeds that before Ollama's first token. `: ping` SSE comments
      # (sent even before the first upstream chunk) keep the edge open.
      keepalive_seconds: 30

  # Aux for opencode's automatic title/background calls. `team-small` is
  # the num_ctx-capped derived model (ai.ollama.derivedModels) -- the
  # uncapped 4B at the 256K server window evicts the primary.
  - model_name: team-small
    litellm_params:
      model: openai/team-small
      api_base: http://host.docker.internal:11434/v1
      api_key: ollama
      keepalive_seconds: 30

general_settings:
  # config.yaml is the source of truth; the DB holds keys and spend only.
  store_model_in_db: false

  # An authed /health otherwise fires real requests, loading every model
  # onto the GPU; background checks serve a cached result.
  background_health_checks: true
  health_check_interval: 300
