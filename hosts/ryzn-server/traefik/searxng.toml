# SearXNG at https://search.cyberfighter.space -- a file-provider route
# because it runs natively (no container, no labels); host.docker.internal
# reaches the host from the traefik container. chain-no-auth: the instance
# is already LAN-open without auth, and basic auth would break adding it as
# a browser search engine.

[http.routers.searxng]
  rule = "Host(`search.cyberfighter.space`)"
  entrypoints = ["websecure"]
  service = "srv-searxng"
  middlewares = ["chain-no-auth"]
  [http.routers.searxng.tls]
    certResolver = "lets-encrypt"

[http.services.srv-searxng.loadBalancer]
  passHostHeader = true
  [[http.services.srv-searxng.loadBalancer.servers]]
    # Must match cyberfighter.features.searxng.port.
    url = "http://host.docker.internal:8080"
