# ReGreet native TOML, imported via lib.importTOML (see the desktop module's
# regreet branch). [background].path and the GTK theme names are injected
# from Nix, not set here.

# Whether to skip asking for username and session, and use the last used ones.
skip_selection = true

[appearance]
greeting_msg = "Welcome back"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[widget.clock]
format = "%a %d %b  %H:%M"
resolution = "1s"
label_width = 200
